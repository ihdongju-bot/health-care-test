<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>제휴 문의</title>

<style>
  :root {
    --bg: #F4F8F6;
    --card: #FFFFFF;
    --border: #E2ECE8;
    --primary: #16665A;
    --text: #14231F;
    --muted: #6B8079;
    --fat: #F16F5C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }
  .container { width: 100%; max-width: 440px; }
  .header { text-align: center; margin-bottom: 24px; }
  .header p.eyebrow { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .header h1 { font-size: 22px; font-weight: 700; margin: 0; }
  .header p.desc { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.6; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .field { margin-bottom: 16px; }
  input, select, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    outline: none;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(22,102,90,0.12);
  }
  textarea { resize: vertical; min-height: 100px; }
  .required { color: var(--fat); }
  button {
    width: 100%;
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .message {
    text-align: center;
    font-size: 13px;
    margin-top: 14px;
    padding: 10px;
    border-radius: 10px;
  }
  .message.success { background: #EAF5F1; color: var(--primary); }
  .message.error { background: #FDECEA; color: var(--fat); }
  .success-screen {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 24px;
    text-align: center;
  }
  .success-screen .icon { font-size: 40px; margin-bottom: 12px; }
  .success-screen h2 { font-size: 18px; margin: 0 0 8px; }
  .success-screen p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <p class="eyebrow">PARTNERSHIP</p>
      <h1>제휴 문의</h1>
      <p class="desc">협업, 입점, 광고 등 제휴 제안을 남겨주시면<br />담당자가 빠르게 확인 후 회신드릴게요.</p>
    </div>

    <div id="form-wrapper">
      <form id="partnership-form">
        <div class="field">
          <label for="name">담당자명 <span class="required">*</span></label>
          <input type="text" id="name" name="name" placeholder="홍길동" required />
        </div>

        <div class="field">
          <label for="company">회사 / 브랜드명 <span class="required">*</span></label>
          <input type="text" id="company" name="company" placeholder="예: (주)헬스케어컴퍼니" required />
        </div>

        <div class="field">
          <label for="email">이메일 <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label for="phone">연락처 (선택)</label>
          <input type="tel" id="phone" name="phone" placeholder="010-1234-5678" />
        </div>

        <div class="field">
          <label for="type">제휴 유형 <span class="required">*</span></label>
          <select id="type" name="제휴 유형" required>
            <option value="">선택해주세요</option>
            <option value="콘텐츠 제휴">콘텐츠 제휴 (영상/음악 등)</option>
            <option value="입점/판매 제휴">입점 · 판매 제휴</option>
            <option value="광고 제휴">광고 제휴</option>
            <option value="기타">기타</option>
          </select>
        </div>

        <div class="field">
          <label for="message">문의 내용 <span class="required">*</span></label>
          <textarea id="message" name="message" placeholder="제안하시는 제휴 내용을 자유롭게 작성해주세요." required></textarea>
        </div>

        <button type="submit" id="submit-btn">문의 보내기</button>
        <div id="form-message"></div>
      </form>
    </div>
  </div>

  <script>
    const FORMSPREE_ENDPOINT = "https://formspree.io/f/moeaaowg";
    const form = document.getElementById("partnership-form");
    const submitBtn = document.getElementById("submit-btn");
    const formMessage = document.getElementById("form-message");
    const formWrapper = document.getElementById("form-wrapper");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = "보내는 중...";
      formMessage.innerHTML = "";

      const formData = new FormData(form);

      try {
        const response = await fetch(FORMSPREE_ENDPOINT, {
          method: "POST",
          body: formData,
          headers: { Accept: "application/json" },
        });

        if (response.ok) {
          formWrapper.innerHTML = `
            <div class="success-screen">
              <div class="icon">✅</div>
              <h2>문의가 접수됐어요</h2>
              <p>빠른 시일 내에 담당자가 이메일로 회신드리겠습니다.<br />소중한 제안 감사합니다.</p>
            </div>
          `;
        } else {
          const data = await response.json().catch(() => null);
          const errMsg = data?.errors?.map((e) => e.message).join(", ") || "전송에 실패했어요. 잠시 후 다시 시도해주세요.";
          formMessage.innerHTML = `<div class="message error">${errMsg}</div>`;
          submitBtn.disabled = false;
          submitBtn.textContent = "문의 보내기";
        }
      } catch {
        formMessage.innerHTML = `<div class="message error">네트워크 오류가 발생했어요. 다시 시도해주세요.</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = "문의 보내기";
      }
    });
  </script>
</body>
</html>
